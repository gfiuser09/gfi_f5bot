name: Running classify_data

on:
  schedule:
    - cron: "50 1 * * *"   # 7:20 AM IST daily, 10 min after history
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: api_key

    env:
      SUPABASE_URL: ${{secrets.SUPABASE_URL}}
      SUPABASE_KEY: ${{secrets.SUPABASE_KEY}}
      F5BOT_EMAIL: ${{secrets.F5BOT_EMAIL}}
      F5BOT_PASSWORD: ${{secrets.F5BOT_PASSWORD}}
      GROQ_API_KEY: ${{secrets.GROQ_API_KEY}}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: |
          pip install -r requirements.txt
          playwright install --with-deps

      - run: python "classify_data.py"